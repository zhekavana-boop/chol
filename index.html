<!DOCTYPE html>
<html lang="uk">
    <link rel="stylesheet" href="style.css">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Чоловічі духи - Victoria Shop</title>
    <!-- Підключення файлу стилів -->
    <link rel="stylesheet" href="men-style.css">
</head>
<body>

    <!-- Шапка -->
    <header>
        <div class="logo">
            Victoria
            <span>SHOP</span>
        </div>
        <div class="nav-buttons">
            <a href="catalog.html" class="header-btn">Назад до категорій</a>
        </div>
    </header>

    <!-- Головна частина -->
    <main>
        <!-- Великий заголовок зверху -->
        <h1 class="catalog-main-title">Дитячі духи</h1>

        <!-- Сітка з 4 чоловічими товарами -->
        <div class="products-grid">
            
            <!-- Товар 1 -->
            <a href="https://zhekavana-boop.github.io/ZARA-HELLO-KITTY/" class="product-card">
                <div class="image-wrapper">
                    <img src="https://images.prom.ua/6748842625_w640_h640_6748842625.jpg" alt="ZARA SEOUL">
                    <div class="product-overlay">
                        <span class="overlay-text">Опис</span>
                    </div>
                </div>
                <div class="product-title">Zara Hello Kitty </div>
                <div class="product-price">650 грн</div>
            </a>

            <!-- Товар 2 -->
            <a href="https://zhekavana-boop.github.io/Zara-applejuice-wonder-rose/" class="product-card">
                <div class="image-wrapper">
                    <img src="https://images.shafastatic.net/699468537" alt="ZARA NIGHT POUR HOMME">
                    <div class="product-overlay">
                        <span class="overlay-text">Опис</span>
                    </div>
                </div>
                <div class="product-title">
Zara applejuice wonder rose </div>
                <div class="product-price">598 грн</div>
            </a>

            <!-- Товар 3 -->
            <a href="https://zhekavana-boop.github.io/ZARA-BATMAN-2024-/"class="product-card">
                <div class="image-wrapper">
                    <img src="https://media.parfumo.com/perfume_imagery/68/684cc6-batman-2024-zara_1200.jpg" alt="ZARA TOBACCO COLLECTION">
                    <div class="product-overlay">
                        <span class="overlay-text">Опис</span>
                    </div>
                </div>
                <div class="product-title">Batman 2024 by Zara </div>
                <div class="product-price">690 грн</div>
            </a>
          

        </div>
    </main>

    <!-- Підвал -->
    <footer>
        <a href="http://WWW.victoria-shop" target="_blank">WWW.victoria-shop</a><br>
        make by Zheka Ivan
    </footer>

</body>
</html>
